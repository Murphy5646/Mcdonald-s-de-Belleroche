<link rel="stylesheet" href="css/style.css"></head><body data-page="jobs"><main id="main">
<div class="page-h"><div class="wrap"><h1>Recrutement</h1><p>Trois étapes, environ cinq minutes. Ce site est indépendant et non affilié à McDonald's Corporation.</p></div></div>
<section class="sec"><div class="wrap"><ol class="steps" aria-hidden="true"><li></li><li></li><li></li></ol><p id="sl" aria-live="polite"></p><div id="res" role="alert" hidden></div>
<form class="rec" id="rec" novalidate>
<fieldset data-step style="border:0;padding:0"><legend tabindex="-1"><h2>Vos coordonnées</h2></legend>
<div class="two"><div class="fld"><label for="prenom">Prénom</label><input id="prenom" name="prenom" autocomplete="given-name"><div class="err"></div></div><div class="fld"><label for="nom">Nom</label><input id="nom" name="nom" autocomplete="family-name"><div class="err"></div></div></div>
<div class="fld"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email"><div class="err"></div></div>
<div class="fld"><label for="tel">Téléphone</label><input id="tel" name="tel" type="tel" autocomplete="tel"><div class="err"></div></div>
<button type="button" class="btn btn-r" data-next>Continuer</button></fieldset>
<fieldset data-step hidden style="border:0;padding:0"><legend tabindex="-1"><h2>Votre profil</h2></legend>
<div class="fld"><label for="poste">Poste recherché</label><select id="poste" name="poste"><option value="">Choisir…</option><option>Équipier polyvalent</option><option>Équipier de salle</option><option>Employé en cuisine</option><option>Autre</option></select><div class="err"></div></div>
<div class="fld"><label for="dispo">Disponibilités</label><input id="dispo" name="dispo" placeholder="Ex. soirs et week-ends"><div class="err"></div></div>
<div class="fld"><label for="experience">Expériences (facultatif)</label><textarea id="experience" name="experience" rows="3"></textarea><div class="err"></div></div>
<button type="button" class="btn btn-o" data-prev>Retour</button> <button type="button" class="btn btn-r" data-next>Continuer</button></fieldset>
<fieldset data-step hidden style="border:0;padding:0"><legend tabindex="-1"><h2>Motivation et documents</h2></legend>
<div class="fld"><label for="motivation">Motivation</label><textarea id="motivation" name="motivation" rows="5"></textarea><div class="err"></div></div>
<div class="fld"><label for="cv">CV (PDF, 5 Mo max)</label><input id="cv" name="cv" type="file" accept="application/pdf"><div class="err"></div></div>
<div class="fld"><label for="lettre">Lettre de motivation (PDF, facultatif)</label><input id="lettre" name="lettre" type="file" accept="application/pdf"><div class="err"></div></div>
<div class="fld"><label class="chk"><input type="checkbox" name="consent"><span>J'accepte que mes données soient traitées pour examiner ma candidature. Elles sont envoyées au serveur de ce projet indépendant, pas à McDonald's Corporation.</span></label><div class="err"></div></div>
<button type="button" class="btn btn-o" data-prev>Retour</button> <button type="submit" class="btn btn-r">Envoyer ma candidature</button></fieldset>
</form></div></section></main><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/recruit.js"></script></body></html>
